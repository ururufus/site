# === HTTP → HTTPS редирект ===
server {
    listen 80;
    server_name sofrust.ru www.sofrust.ru;
    return 301 https://$host$request_uri;
}

# === HTTPS сервер ===
server {
    listen 443 ssl http2; 
    server_name sofrust.ru www.sofrust.ru;

    # SSL-сертификаты
    ssl_certificate /etc/letsencrypt/live/sofrust.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sofrust.ru/privkey.pem;
    
    # Надёжные настройки шифрования
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # === Заголовки безопасности и кэширования ===
    # Для HTML: запрет кэша, чтобы всегда получать актуальный контент
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    
    # Защита от MIME-sniffing и кликифрейминга
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    
    # HSTS: раскомментируйте ТОЛЬКО после полной проверки!
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # === Проксирование на Flask через uWSGI ===
    location / {
        include uwsgi_params;
        uwsgi_pass flask:8080;
        
        # Передаём Flask информацию о протоколе и реальном IP
        uwsgi_param X-Forwarded-Proto https;
        uwsgi_param X-Forwarded-For $proxy_add_x_forwarded_for;
        uwsgi_param X-Real-IP $remote_addr;
        uwsgi_param Host $host;
    }

    # === Статика и загруженные файлы ===
    location /static/ {
        alias /app/static/;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }
    
    location /upload/ {
        alias /app/static/upload/;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }
}